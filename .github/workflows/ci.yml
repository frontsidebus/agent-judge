# agent-judge CI. Tests run offline (no network access from the tests: stub frontier CLI, loopback stub gateway,
# temp dirs) and single-threaded. Only distro packages are installed; nothing reads a real site.env or judge.env.
# Actions are pinned to commit SHAs, as in local-inference-deck.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Install tools (Ubuntu packages)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-pytest python3-yaml shellcheck
      # tools/deck-tools/README.md: every vendored file matches tools/tools.lock (content and mode); on a pull
      # request an engine change since the base must come with a version bump (in practice: a re-sync from a tag)
      - name: deck-tools verify
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 tools/deck-tools/deck-tools verify
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            python3 tools/deck-tools/deck-tools verify --base FETCH_HEAD
          fi
      # The judge's own suite. HERMES_VENV_PYTHON: install.sh edits config.yaml with a PyYAML python; the distro
      # python3 has it. The systemd-analyze test needs a user systemd manager (XDG_RUNTIME_DIR), which a CI
      # runner does not have; run it locally (CONVENTIONS.md "Before every commit").
      - name: judge tests
        env:
          HERMES_VENV_PYTHON: /usr/bin/python3
        run: >-
          python3 -m pytest judge/tests -q -p no:cacheprovider
          --deselect judge/tests/test_install.py::test_rendered_units_pass_systemd_analyze_verify
      # Repo-level tests (outside judge/, so they never change code_version): the split's multi-repo classifier
      # fixtures, relocated-checkout regressions, C10 for this root, and tools/drill.py with fakes
      - name: repo tests (split layout, relocated checkout, drill)
        run: python3 -m pytest tests -q -p no:cacheprovider
      - name: check-sanitized (generic secret shapes; no real values in CI)
        run: CI=true bash scripts/check-sanitized.sh --all --regex-only
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh tools/deck-tools/*.sh tools/deck-tools/pre-commit

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # the action lists a PR's commits to scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9 (= v2)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
